name: Release desktop applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check release version and MCP packaging configuration
        run: node .github/scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: npm install --no-package-lock
      - name: Test frontend, version rules and resource validation
        run: npm test
      - run: npm exec vue-tsc -- --noEmit

  prepare-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "ChatGPT中转工具 $GITHUB_REF_NAME" \
              --notes "正在生成跨平台安装包。"
          fi

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout source
        shell: pwsh
        run: |
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Prepare toolchains
        shell: pwsh
        run: |
          node --version
          npm --version
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt
          node .github/scripts/check-release.mjs $env:GITHUB_REF_NAME
          $env:SEVEN_ZIP_BINARY = (Get-Command 7z -ErrorAction Stop).Source
          "SEVEN_ZIP_BINARY=$env:SEVEN_ZIP_BINARY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm install --no-package-lock
      - name: Build and test Windows MCP for both architectures
        run: npm run build:mcp -- --platform windows
      - run: npm exec vite -- build
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows applications
        run: npm exec tauri -- build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Collect Windows assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          $bundle = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -File | Where-Object {
            $_.Name -like "*_$($version)_*-setup.exe"
          }
          if (@($installer).Count -ne 1) { throw "Expected one NSIS installer" }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw "Updater signature is missing" }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $portableName = "711EV-Codex-Tool-$version-Windows-portable.exe"
          $installerName = "711EV-Codex-Tool-$version-Windows-setup.exe"
          Copy-Item "src-tauri/target/release/711EV-Codex-Tool.exe" "release-assets/$portableName"
          Copy-Item $installer.FullName "release-assets/$installerName"
          Copy-Item $signature "release-assets/$installerName.sig"
      - name: Verify embedded Windows MCP
        run: node scripts/verify-mcp-package.mjs src-tauri/target/release/711EV-Codex-Tool.exe src-tauri/target/release/bundle/nsis
      - name: Upload Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release-assets -File | Select-Object -ExpandProperty FullName
          if (@($assets).Count -ne 3) { throw "Expected three Windows release assets" }
          gh release upload $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --clobber @assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows release assets" }

  build-macos:
    needs: prepare-release
    runs-on: macos-14
    steps:
      - name: Checkout source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - name: Prepare toolchains
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup component add rustfmt
          node .github/scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: npm install --no-package-lock
      - name: Build and test macOS MCP for both architectures
        run: npm run build:mcp -- --platform macos
      - run: npm exec vite -- build
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build universal macOS applications
        run: npm exec tauri -- build --target universal-apple-darwin --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Verify MCP in macOS app, disk image and updater
        run: node scripts/verify-mcp-macos-package.mjs src-tauri/target/universal-apple-darwin/release/bundle
      - name: Collect macOS assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          bundle="src-tauri/target/universal-apple-darwin/release/bundle"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          updater="$(find "$bundle/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$dmg"
          test -n "$updater"
          test -f "$updater.sig"
          mkdir -p release-assets
          cp "$dmg" "release-assets/711EV-Codex-Tool-${version}-macOS-universal.dmg"
          cp "$updater" "release-assets/711EV-Codex-Tool-${version}-macOS-updater.app.tar.gz"
          cp "$updater.sig" "release-assets/711EV-Codex-Tool-${version}-macOS-updater.app.tar.gz.sig"
      - name: Upload macOS assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-assets/*

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern '*'
      - name: Verify Node.js and release version before publishing
        run: node .github/scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Create cross-platform update manifest
        run: node .github/scripts/create-update-manifest.mjs release-assets "$GITHUB_REPOSITORY"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-release.mjs release-assets "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
