[package]
name = "codex-local-sync"
version = "0.1.107"
description = "Portable local Codex session synchronization"
authors = ["Codex Local Sync contributors"]
edition = "2021"

[lib]
name = "codex_local_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
walkdir = "2"
notify = "6.1"
dirs = "6"
fs2 = "0.4"
sysinfo = "0.33"
thiserror = "2"
libc = "0.2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "ApplicationModel",
    "ApplicationModel_Core",
    "Foundation_Collections",
    "Management_Deployment",
    "Win32_System_Com",
    "Win32_UI_Shell"
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3"
